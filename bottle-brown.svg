:root{
  --terracotta:#a8492f; --terracotta-dark:#7f2f22; --cream:#f7eddc; --cream-2:#fff8eb;
  --charcoal:#27201d; --gold:#d8a953; --green:#3f6b44; --red:#9f1d20; --brown:#6b3f2a;
  --shadow:0 18px 50px rgba(39,32,29,.15); --radius:28px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--cream);color:var(--charcoal);font-family:'Work Sans',system-ui,sans-serif} a{color:inherit;text-decoration:none} button,input,select{font:inherit} button{cursor:pointer;border:0}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at top left,rgba(168,73,47,.16),transparent 35%),linear-gradient(90deg,rgba(39,32,29,.035) 1px,transparent 1px);background-size:auto,34px 34px;z-index:-1}
.header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;background:rgba(247,237,220,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(39,32,29,.08)}
.brand{font-family:'Playfair Display',serif;font-weight:800;font-size:1.35rem;letter-spacing:.04em}.brand span{font-family:'Caveat',cursive;color:var(--terracotta);font-size:1.55rem;margin-right:4px}.header nav{display:flex;gap:26px;font-weight:600}.header-actions{display:flex;gap:10px;align-items:center}.lang,.cart-button,.secondary{background:#fff8;border:1px solid rgba(39,32,29,.12);border-radius:999px;padding:10px 16px;display:inline-flex;align-items:center;gap:8px}.cart-button b{background:var(--terracotta);color:white;border-radius:999px;padding:1px 7px}.section{padding:88px 6vw}.hero{display:grid;grid-template-columns:1.05fr .95fr;min-height:82vh;align-items:center;gap:40px}.kicker,.pepper{color:var(--terracotta);font-weight:700;text-transform:uppercase;letter-spacing:.11em;font-size:.78rem}.hero h1,.section h2{font-family:'Playfair Display',serif;font-size:clamp(3rem,7vw,6.7rem);line-height:.94;margin:10px 0 18px}.hero p{font-size:1.14rem;line-height:1.7;max-width:650px}.badges,.chips{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.badges span,.chips span{padding:10px 14px;background:var(--cream-2);border:1px solid rgba(39,32,29,.1);border-radius:999px;font-weight:700}.hero-actions{display:flex;gap:14px;flex-wrap:wrap}.primary{background:var(--charcoal);color:var(--cream-2);padding:14px 22px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow)}.secondary{background:var(--terracotta);color:white;border:0;font-weight:800}.bottle-stage{position:relative;display:flex;justify-content:center;align-items:end;gap:0;background:linear-gradient(145deg,#fff9,rgba(216,169,83,.22));border:1px solid rgba(39,32,29,.1);border-radius:44px;min-height:560px;padding:30px;box-shadow:var(--shadow)}.bottle-stage img{width:32%;filter:drop-shadow(0 24px 20px rgba(0,0,0,.22))}.bottle-stage .center{width:38%;margin:0 -16px;z-index:2}.story{display:grid;grid-template-columns:330px 1fr;gap:56px;align-items:center;background:var(--charcoal);color:var(--cream);border-radius:44px;margin:0 6vw;padding:60px}.medallion{aspect-ratio:1;border-radius:50%;border:2px dashed var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.06)}.medallion span{font-family:'Playfair Display',serif;font-size:2.1rem;font-weight:800}.medallion small{margin-top:8px;color:var(--gold);font-weight:700}.script{font-family:'Caveat',cursive;font-size:2rem;color:var(--gold);margin:0}.story h2,.products h2,.pairings h2{font-size:clamp(2.4rem,5vw,4.5rem)}.story p:not(.script){font-size:1.08rem;line-height:1.8}.section-heading{text-align:center;max-width:760px;margin:0 auto 40px}.section-heading p{line-height:1.7}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.product-card{background:var(--cream-2);border:1px solid rgba(39,32,29,.1);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}.product-card>img{display:block;height:320px;width:100%;object-fit:contain;padding:26px;background:linear-gradient(#fff8,#ead7bc)}.product-body{padding:26px}.pepper{display:flex;align-items:center;gap:8px}.product-body h3{font-family:'Playfair Display',serif;font-size:1.8rem;margin:8px 0}.heat-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.heat{display:flex;gap:2px;color:#c6b7a2}.heat .active{color:var(--terracotta)}label{display:grid;gap:8px;font-weight:700;margin:14px 0}select,input{width:100%;padding:13px 14px;border:1px solid rgba(39,32,29,.16);border-radius:15px;background:white}.full{width:100%;margin-top:12px}.pairing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.pair-card{min-height:240px;border-radius:34px;padding:28px;background:linear-gradient(145deg,rgba(168,73,47,.9),rgba(39,32,29,.92)),url('/pattern.svg');color:white;display:flex;flex-direction:column;justify-content:end;box-shadow:var(--shadow)}.pair-card h3{font-family:'Playfair Display',serif;font-size:2.2rem;margin:0}.chips{justify-content:center}.drawer{position:fixed;right:-480px;top:0;width:min(480px,100vw);height:100dvh;background:var(--cream-2);z-index:30;padding:24px;transition:.28s ease;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}.drawer.open{right:0}.drawer-header{display:flex;justify-content:space-between;align-items:center}.drawer-header h2{font-family:'Playfair Display',serif}.drawer-header button{background:transparent}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20}.empty{padding:18px;border-radius:18px;background:var(--cream)}.cart-item{display:grid;grid-template-columns:1fr 72px 32px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(39,32,29,.12)}.cart-item p{margin:4px 0 0}.cart-item button{border-radius:50%;background:var(--terracotta);color:white;font-size:1.4rem}.totals{display:grid;grid-template-columns:1fr auto;gap:8px;padding:20px 0;font-size:1.05rem}.totals b:last-child{font-size:1.35rem}.checkout{padding-bottom:30px}.status{font-weight:700;color:var(--terracotta)}footer{text-align:center;padding:44px 6vw;background:var(--charcoal);color:var(--cream)}footer b{font-family:'Playfair Display',serif;font-size:1.5rem}footer span{color:var(--gold);font-family:'Caveat',cursive;font-size:1.7rem}
@media(max-width:900px){.header nav{display:none}.hero,.story,.product-grid,.pairing-grid{grid-template-columns:1fr}.hero{padding-top:42px}.bottle-stage{min-height:420px}.story{margin:0 4vw;padding:36px}.medallion{max-width:280px;margin:auto}.product-card>img{height:260px}}
